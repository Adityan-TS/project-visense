# XcodeGen spec. Generate the Xcode project with:
#   cd ios && xcodegen generate && open ViSense.xcodeproj
# Signing (team + bundle id) lives in Signing.xcconfig so regenerating never loses it.
name: ViSense
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # On-device speaker voiceprints (Core ML, Neural Engine) for speaker names.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ViSense:
    type: application
    platform: iOS
    sources:
      - path: ViSense
    dependencies:
      - package: FluidAudio
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: ViSense/Info.plist
      properties:
        CFBundleDisplayName: ViSense
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Keep running in the background / with the phone locked:
        #  bluetooth-central -> BLE events keep waking us
        #  audio             -> active AVAudioSession keeps us alive (see AudioIO.swift)
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: ViSense connects to your caption glasses over Bluetooth.
        NSSpeechRecognitionUsageDescription: ViSense turns speech into live captions on your glasses, on this iPhone.
        # Filled from Secrets.xcconfig (git-ignored), read by DatabricksConfig.
        DatabricksToken: $(DATABRICKS_TOKEN)
        DatabricksWarehouseID: $(DATABRICKS_WAREHOUSE_ID)
        NSMicrophoneUsageDescription: ViSense can use the iPhone microphone for captions when the glasses mic is not used.
